<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cinema Ticket Booking System</title>
</head>
<body>
    <h1>🎬 Cinema Ticket Booking System</h1>
    <label for="name">Name: </label>
    <input type="text" id="name" name="name"><br><br>

    <label for="age">Age: </label>
    <input type="number" id="age" name="age"><br><br>

    <label for="tickets">Number of tickets: </label>
    <input type="number" id="tickets" name="tickets"><br><br>

    <button onclick="calculateTicket()">Calculate price</button>
    <button onclick="clearTicket()">Clear</button>

    <hr style="width: 35%; margin-left: 0; margin-right: auto;">

    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
